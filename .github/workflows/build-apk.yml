name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icon
        run: |
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw
          src = Image.open('icon-512.png').convert('RGBA')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          def mask(s, shape):
              m = Image.new('L', (s*4, s*4), 0)
              dr = ImageDraw.Draw(m)
              if shape == 'round':
                  dr.ellipse([0, 0, s*4-1, s*4-1], fill=255)
              else:
                  dr.rounded_rectangle([0, 0, s*4-1, s*4-1], radius=int(s*4*0.22), fill=255)
              return m.resize((s, s), Image.LANCZOS)
          for d, s in sizes.items():
              out = f'android/app/src/main/res/mipmap-{d}'
              os.makedirs(out, exist_ok=True)
              base = src.resize((s, s), Image.LANCZOS)
              for n, shape in (('ic_launcher.png','sq'),('ic_launcher_round.png','round'),('ic_launcher_foreground.png','sq')):
                  img = base.copy(); img.putalpha(mask(s, shape)); img.save(f'{out}/{n}')
          for f in glob.glob('android/app/src/main/res/mipmap-anydpi*/ic_launcher*.xml'):
              os.remove(f)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatUang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
