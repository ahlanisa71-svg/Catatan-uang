name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png www/
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          css = '<style>html,body,#app{width:100%!important;height:100%!important;max-width:none!important;border-radius:0!important;box-shadow:none!important}body{background:var(--bg)!important;display:block!important}#app{align-self:stretch!important}</style>'
          s = s.replace('</head>', css + '</head>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android theme (follow phone dark mode)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('Theme.AppCompat.Light.NoActionBar', 'Theme.AppCompat.DayNight.NoActionBar')
          s = s.replace('Theme.AppCompat.Light.DarkActionBar', 'Theme.AppCompat.DayNight.DarkActionBar')
          s = s.replace('<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">',
                        '<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:forceDarkAllowed">false</item>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Set app icon and splash screen
        run: |
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw
          src = Image.open('icon-512.png').convert('RGBA')
          def mask(s, shape):
              m = Image.new('L', (s*4, s*4), 0)
              dr = ImageDraw.Draw(m)
              if shape == 'round':
                  dr.ellipse([0, 0, s*4-1, s*4-1], fill=255)
              else:
                  dr.rounded_rectangle([0, 0, s*4-1, s*4-1], radius=int(s*4*0.22), fill=255)
              return m.resize((s, s), Image.LANCZOS)
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d, s in sizes.items():
              out = f'android/app/src/main/res/mipmap-{d}'
              os.makedirs(out, exist_ok=True)
              base = src.resize((s, s), Image.LANCZOS)
              for n, shape in (('ic_launcher.png','sq'),('ic_launcher_round.png','round'),('ic_launcher_foreground.png','sq')):
                  img = base.copy(); img.putalpha(mask(s, shape)); img.save(f'{out}/{n}')
          for f in glob.glob('android/app/src/main/res/mipmap-anydpi*/ic_launcher*.xml'):
              os.remove(f)
          # layar pembuka: latar teal + ikon di tengah (ganti logo Capacitor)
          for f in glob.glob('android/app/src/main/res/drawable*/splash.png'):
              w, h = Image.open(f).size
              bg = Image.new('RGBA', (w, h), '#1d4e5f')
              sz = int(min(w, h) * 0.30)
              ic = src.resize((sz, sz), Image.LANCZOS)
              ic.putalpha(mask(sz, 'sq'))
              bg.alpha_composite(ic, ((w - sz)//2, (h - sz)//2))
              bg.convert('RGB').save(f)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatUang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
